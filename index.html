<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Games</title>

        body {
            background-color: #0f172a;

            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;

        }
        h1 { color: #38bdf8; margin: 10px 0; font-size: 24px; }

            max-width: 360px;

        }
        .score { font-size: 36px; font-weight: bold; color: #facc15; margin: 5px 0; }
        .energy { font-size: 14px; color: #34d399; font-weight: bold; }
        .tap-btn {
            background: radial-gradient(circle, #facc15, #eab308);
            color: #0f172a;
            border: 4px solid #fef08a;
            border-radius: 50%;

            height: 140px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.5);
            transition: 0.1s;
            margin: 15px 0;
        }
        .tap-btn:active { transform: scale(0.92); }

            background: #1e293b;
            border-radius: 15px;
            padding: 15px;
            margin: 15px auto;
            max-width: 360px;
            text-align: right;
        }
