<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Games - Tap to Earn</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        h1 { color: #38bdf8; margin: 10px 0; font-size: 24px; }
        .card {
            background: #1e293b;
            border-radius: 15px;
            padding: 15px;
            margin: 10px auto;
            max-width: 360px;
            border: 1px solid #334155;
        }
        .score { font-size: 36px; font-weight: bold; color: #facc15; margin: 5px 0; }
        .energy { font-size: 14px; color: #34d399; font-weight: bold; margin-bottom: 10px; }
        .tap-btn {
            background: radial-gradient(circle, #facc15, #eab308);
            color: #0f172a;
            border: 4px solid #fef08a;
            border-radius: 50%;
            width: 140px;
            height: 140px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.5);
            transition: 0.1s;
            margin: 10px 0;
        }
        .tap-btn:active { transform: scale(0.92); }
        .section {
            background: #1e293b;
            border-radius: 15px;
            padding: 15px;
            margin: 15px auto;
            max-width: 360px;
            text-align: right;
        }
        .section h3 { margin: 0 0 10px 0; color: #38bdf8; font-size: 16px; border-bottom: 1px solid #334155; padding-bottom: 8px; text-align: center; }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .btn-small {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-small:disabled { background-color: #475569; color: #94a3b8; cursor: not-allowed; }
        .wheel-btn {
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .input-field {
            width: 100%;
            padding: 10px;
            margin: 5px 0 10px 0;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }
        .withdraw-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>👑 King Games 👑</h1>

    <!-- قسم النقر والطاقة -->
    <div class="card">
        <div>رصيدك الحالي</div>
        <div class="score" id="score">0</div>
        <div class="energy">⚡ الطاقة: <span id="energy">100</span> / 100</div>
        <button class="tap-btn" onclick="tapCoin()">اضغط 💰</button>
    </div>

    <!-- عجلة الحظ -->
    <div class="section">
        <h3>🎡 عجلة الحظ السريعة</h3>
        <button class="wheel-btn" id="spinBtn" onclick="spinWheel()">لف العجلة واكسب 🎲</button>
    </div>

    <!-- المهام اليومية -->
    <div class="section">
        <h3>📋 المهام اليومية</h3>
        <div class="task-item">
            <span>🎁 مكافأة الدخول (+50)</span>
            <button class="btn-small" id="task1" onclick="claimTask('task1', 50)">استلم</button>
        </div>
        <div class="task-item">
            <span>📢 اشتراك القناة (+100)</span>
            <button class="btn-small" id="task2" onclick="claimTask('task2', 100)">تنفيذ</button>
        </div>
    </div>

    <!-- قسم السحب اليدوي -->
    <div class="section">
        <h3>💸 طلب سحب الأرباح</h3>
        <label style="font-size: 12px; color: #cbd5e1;">معرف محفظتك أو فودافون كاش:</label>
        <input type="text" id="walletInput" class="input-field" placeholder="اكتب رقمك أو محفظتك هنا...">
        <button class="withdraw-btn" onclick="requestWithdraw()">إرسال طلب السحب 📤</button>
    </div>

    <script>
        let score = parseInt(localStorage.getItem('kg_score')) || 0;
        let energy = 100;

        document.getElementById("score").innerText = score;

        function updateScore(points) {
            score += points;
            document.getElementById("score").innerText = score;
            localStorage.setItem('kg_score', score);
        }

        function tapCoin() {
            if (energy > 0) {
                energy -= 1;
                document.getElementById("energy").innerText = energy;
                updateScore(1);
            } else {
                alert("⚡ طاقتك خلصت! انتظر ثواني لتشحن.");
            }
        }

        setInterval(() => {
            if (energy < 100) {
                energy += 1;
                document.getElementById("energy").innerText = energy;
            }
        }, 2000);

        function spinWheel() {
            const prizes = [10, 20, 50, 100, 5, 30];
            const win = prizes[Math.floor(Math.random() * prizes.length)];
            updateScore(win);
            alert("🎉 مبروك! كسبت " + win + " نقطة من عجلة الحظ!");
            const btn = document.getElementById("spinBtn");
            btn.disabled = true;
            btn.innerText = "انتظر قليلاً ⏳";
            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "لف العجلة واكسب 🎲";
            }, 15000);
        }

        function claimTask(btnId, reward) {
            const btn = document.getElementById(btnId);
            if (!btn.disabled) {
                updateScore(reward);
                btn.disabled = true;
                btn.innerText = "تم ✔️";
                alert("👏 ممتاز! تمت إضافة " + reward + " نقطة.");
            }
        }

        function requestWithdraw() {
            const wallet = document.getElementById('walletInput').value.trim();
            if (!wallet) {
                alert("⚠️ من فضلك اكتب رقم المحفظة أو الحساب أولاً!");
                return;
            }
            if (score < 500) {
                alert("❌ الحد الأدنى للسحب هو 500 نقطة! رصيدك الحالي غير كافٍ.");
                return;
            }
            alert("✅ تم إرسال طلب السحب بنجاح للمراجعة اليدوية!\nسيتم التواصل معك وتحويل الأرباح قريباً.");
            document.getElementById('walletInput').value = "";
        }
    </script>

</body>
    </html>
