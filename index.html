<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Games</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px;
        }
        h1 { color: #38bdf8; margin-bottom: 20px; }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 30px;
            max-width: 350px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .score {
            font-size: 40px;
            font-weight: bold;
            color: #facc15;
            margin: 20px 0;
        }
        .tap-btn {
            background: linear-gradient(135deg, #facc15, #eab308);
            color: #0f172a;
            border: none;
            border-radius: 50%;
            width: 140px;
            height: 140px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(250, 204, 21, 0.4);
            transition: 0.1s;
        }
        .tap-btn:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <h1>👑 King Games 👑</h1>
    
    <div class="card">
        <p>رصيدك الحالي:</p>
        <div class="score" id="score">0</div>
        
        <button class="tap-btn" onclick="addPoint()">اضغط 💰</button>
    </div>

    <script>
        let score = parseInt(localStorage.getItem('kg_score')) || 0;
        document.getElementById("score").innerText = score;

        function addPoint() {
            score += 1;
            document.getElementById("score").innerText = score;
            localStorage.setItem('kg_score', score);
        }
    </script>

</body>
</html>
